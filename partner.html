<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resility · Partner Program</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1b2e;
    --bg2: #0f2038;
    --bg3: #132640;
    --accent: #7c5cbf;
    --accent-bright: #9b7de0;
    --accent-glow: rgba(124,92,191,0.18);
    --teal: #4ecdc4;
    --text: #e8f0fe;
    --text-muted: #7a9abf;
    --border: rgba(124,92,191,0.18);
    --card: rgba(15,32,56,0.8);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 60px;
    background: rgba(13,27,46,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  nav a.cta-nav {
    background: var(--accent);
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 10px 28px;
    text-decoration: none;
    border-radius: 50px;
    transition: background 0.2s, transform 0.2s;
  }
  nav a.cta-nav:hover { background: var(--accent-bright); transform: translateY(-1px); }
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 140px 40px 80px;
    overflow: hidden;
  }
  .hero-grid {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(124,92,191,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(124,92,191,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 0%, transparent 100%);
  }
  .badge {
    display: inline-block;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 4px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 18px;
    margin-bottom: 32px;
  }
  .hero h1 {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 900;
    line-height: 1.1;
    max-width: 800px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin-top: 24px; font-size: 1.15rem; color: var(--text-muted); max-width: 600px; line-height: 1.7; }
  .hero-cta { margin-top: 48px; display: flex; gap: 16px; justify-content: center; }
  .btn-primary { background: var(--accent); color: #fff; font-weight: 700; padding: 16px 40px; text-decoration: none; border-radius: 50px; transition: all 0.2s; }
  .btn-primary:hover { background: var(--accent-bright); transform: translateY(-2px); }
</style>
</head>
<body>

<nav>
  <span style="font-weight: 900; font-size: 1.5rem; color: #fff;">Resility</span>
  <a href="#inscribirse" class="cta-nav">Inscribirse como Partner →</a>
</nav>

<div class="hero">
  <div class="hero-grid"></div>
  <div class="badge">PROGRAMA DE CANAL · PARTNER PROGRAM</div>
  <h1>Vende ciberseguridad.<br><em>Nosotros operamos todo.</em></h1>
  <p>Resility CyberSOC-as-a-Service. Ingresos recurrentes mensuales para integradores, consultores y partners tecnológicos en LATAM.</p>
  <div class="hero-cta">
    <a href="#servicios" class="btn-primary">Ver servicios →</a>
  </div>
</div>
