<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor Digital — Microglobal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d2d6b;--blue:#1a6fba;--sky:#2db3e0;
  --green:#075E54;--green-l:#dcf8c6;
  --wsp-bg:#ECE5DD;--wsp-in:#fff;--wsp-out:#dcf8c6;
  --wsp-hdr:#075E54;--wsp-hdr2:#128C7E;
  --red:#B91C1C;--red-bg:#FEE2E2;
  --amber:#92400E;--amber-bg:#FEF3C7;
  --blue-bg:#EFF6FF;
  --purple:#5B21B6;--purple-bg:#EDE9FE;
  --teal:#0F766E;--teal-bg:#F0FDFA;
  --border:#e5e7eb;--bg:#f3f4f6;
  --text:#111827;--sub:#6B7280;--muted:#9CA3AF;
  --gold:#F59E0B;--silver:#94A3B8;--bronze:#B45309;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:290px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-top{background:var(--wsp-hdr);padding:11px 14px;flex-shrink:0}
.sb-brand{font-size:13px;font-weight:800;color:#fff;letter-spacing:-.2px}
.sb-sub{font-size:9px;color:rgba(255,255,255,.65);margin-top:1px}

/* MAIN TABS (Chat / Rankings) */
.main-tabs{display:flex;background:#f8fafc;border-bottom:1px solid var(--border);flex-shrink:0}
.mt-tab{flex:1;padding:9px 6px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;border:none;background:transparent;font-family:inherit}
.mt-tab.active{color:var(--navy);border-bottom:2px solid var(--navy);background:#fff}
.mt-tab:hover:not(.active){color:var(--navy)}

.sb-search{padding:7px 10px;border-bottom:1px solid var(--border);background:#f0f2f5}
.sb-search input{width:100%;padding:6px 10px;border-radius:20px;border:none;background:#fff;font-size:11px;outline:none;font-family:inherit}

.contact-list{flex:1;overflow-y:auto}
.list-section{padding:5px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f9fafb;border-bottom:1px solid var(--border)}

/* CONTACT ITEM — with rank indicator */
.contact-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:background .12s;position:relative}
.contact-item:hover{background:#f9fafb}
.contact-item.active{background:#f0f4ff}
.contact-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--navy)}
.ci-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;position:relative}
.ci-online{position:absolute;bottom:1px;right:1px;width:8px;height:8px;border-radius:50%;background:#25D366;border:2px solid #fff}
.ci-body{flex:1;min-width:0}
.ci-row1{display:flex;align-items:center;gap:5px}
.ci-name{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci-preview{font-size:9px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* RANK PILL */
.rank-pill{display:flex;align-items:center;gap:3px;flex-shrink:0}
.rp-pos{font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.rp-bar-wrap{width:32px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.rp-bar{height:100%;border-radius:2px;transition:width .6s ease}
/* BADGE */
.ci-badge{background:var(--wsp-hdr);color:#fff;font-size:8px;font-weight:800;padding:2px 5px;border-radius:9px;min-width:16px;text-align:center;flex-shrink:0}

/* ── MAIN AREA ── */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── CHAT VIEW ── */
.chat-view{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--wsp-bg)}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg)}
.chat-empty-icon{font-size:44px;opacity:.25}
.chat-empty-lbl{font-size:13px;font-weight:600;color:var(--muted)}

.chat-hdr{background:var(--wsp-hdr);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.ch-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.ch-name{font-size:12px;font-weight:700;color:#fff}
.ch-status{font-size:9px;color:rgba(255,255,255,.7)}
.ch-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ch-rank-badge{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);padding:4px 9px;border-radius:10px;font-size:10px;color:#fff;font-weight:700}
.ch-tag{font-size:9px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);padding:3px 7px;border-radius:8px;font-weight:600}

.chat-msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background-image:url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23b0bec5' fill-opacity='0.05'%3E%3Cpath d='M26 24v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-26V-6h-2v4h-4v2h4v4h2V0h4v-2h-4z'/%3E%3C/g%3E%3C/svg%3E")}
.date-sep{text-align:center;margin:6px 0}.date-sep span{font-size:9px;background:rgba(255,255,255,.72);padding:3px 9px;border-radius:9px;color:var(--sub);font-weight:600}

.msg-wrap{display:flex;flex-direction:column;margin-bottom:2px}
.msg-wrap.out{align-items:flex-end}.msg-wrap.in{align-items:flex-start}
.msg-b{max-width:76%;padding:7px 10px 4px;border-radius:8px;font-size:11px;line-height:1.5;word-break:break-word}
.msg-b.in{background:#fff;border-top-left-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.09)}
.msg-b.out{background:var(--wsp-out);border-top-right-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.09)}
.msg-b.proactive{background:#EFF6FF;border-left:3px solid var(--navy);border-top-left-radius:2px}
.msg-b.alert-msg{background:#FFFBEB;border-left:3px solid var(--gold)}
.msg-sender{font-size:9px;font-weight:700;color:var(--navy);margin-bottom:3px}
.msg-tr{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:3px}
.msg-time{font-size:8px;color:var(--muted)}
.msg-ticks{font-size:9px;color:#53bdeb}
.msg-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06)}
.m-btn{font-size:10px;padding:4px 10px;border-radius:14px;border:1.5px solid var(--navy);color:var(--navy);background:transparent;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;white-space:nowrap}
.m-btn:hover,.m-btn.done{background:var(--navy);color:#fff}
.m-btn.sec{border-color:var(--muted);color:var(--sub)}.m-btn.sec:hover{background:var(--sub);color:#fff;border-color:var(--sub)}

.typing-wrap{padding:5px 14px;background:var(--wsp-bg);display:none}
.typing-b{background:#fff;padding:9px 12px;border-radius:8px;border-top-left-radius:2px;display:inline-flex;gap:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tdot{width:6px;height:6px;border-radius:50%;background:#bbb;animation:bounce 1.2s infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

.quick-chips{padding:6px 10px;background:#f0f2f5;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--border);flex-shrink:0}
.qc{font-size:9px;padding:4px 9px;border-radius:12px;background:#fff;border:1px solid var(--border);color:var(--navy);cursor:pointer;font-weight:600;transition:all .15s;font-family:inherit}
.qc:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.chat-input-area{background:#f0f2f5;padding:7px 10px;display:flex;align-items:center;gap:7px;flex-shrink:0;border-top:1px solid var(--border)}
.chat-inp{flex:1;background:#fff;border:none;border-radius:18px;padding:8px 13px;font-size:12px;outline:none;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--wsp-hdr);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.send-btn:hover{background:var(--wsp-hdr2)}
.send-btn svg{fill:#fff;width:15px;height:15px}

/* ── RANKING VIEW ── */
.rank-view{flex:1;overflow-y:auto;background:#fff;display:none}
.rv-top{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.rv-title{font-size:14px;font-weight:800;color:var(--navy)}
.period-tabs{display:flex;gap:0;background:#f0f2f5;border-radius:8px;overflow:hidden;padding:2px}
.pt{font-size:10px;font-weight:700;padding:5px 11px;cursor:pointer;border-radius:6px;color:var(--sub);border:none;background:transparent;font-family:inherit;transition:all .15s}
.pt.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rv-export{margin-left:auto;font-size:10px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;font-family:inherit}
.rv-export:hover{background:var(--navy);color:#fff;border-color:var(--navy)}

/* KPI CATEGORY SECTIONS */
.kpi-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.ks-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
.ks-icon{font-size:16px}
.ks-title{font-size:13px;font-weight:800;color:var(--navy)}
.ks-desc{font-size:10px;color:var(--sub);margin-left:4px}
.ks-toggle{margin-left:auto;font-size:10px;color:var(--blue);font-weight:700}
.ks-body{overflow:hidden;transition:max-height .3s ease}

/* RANKING TABLE */
.rk-table{width:100%;border-collapse:collapse}
.rk-table th{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:5px 10px;border-bottom:1px solid var(--border);background:#fafbfc;text-align:left;white-space:nowrap;position:sticky;top:0}
.rk-table th:not(:first-child){text-align:center}
.rk-table td{padding:8px 10px;border-bottom:1px solid #f3f4f6;font-size:11px;vertical-align:middle}
.rk-table td:not(:first-child){text-align:center}
.rk-table tr:hover td{background:#f9fafb}
.rk-table tr{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

.vend-cell{display:flex;align-items:center;gap:7px}
.vav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;flex-shrink:0}
.vname{font-size:11px;font-weight:700;color:var(--text)}
.vsub{font-size:9px;color:var(--sub)}
.medal{font-size:14px}

.badge-green{background:var(--teal-bg);color:var(--teal);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.badge-blue{background:var(--blue-bg);color:var(--blue);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.badge-amber{background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.badge-red{background:var(--red-bg);color:var(--red);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.badge-purple{background:var(--purple-bg);color:var(--purple);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.badge-gray{background:#f3f4f6;color:var(--sub);font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}

.mini-bar-wrap{display:flex;align-items:center;gap:4px;justify-content:center}
.mini-track{width:48px;height:5px;background:var(--border);border-radius:2px;overflow:hidden}
.mini-fill{height:100%;border-radius:2px}
.mf-h{background:var(--teal)}.mf-m{background:var(--blue)}.mf-l{background:var(--gold)}.mf-x{background:var(--red)}

/* SCORE DONUT (simple text circle) */
.score-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;margin:0 auto}

/* ONLINE / OFFLINE indicator */
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-on{background:#22C55E}.dot-away{background:#F59E0B}.dot-off{background:#EF4444}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:8px;font-size:12px;display:none;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:380px;text-align:center}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
</style>
</head>
<body>
<div class="app">

<!-- ── SIDEBAR ── -->
<div class="sidebar">
  <div class="sb-top">
    <div class="sb-brand">Microglobal</div>
    <div class="sb-sub">Supervisor Digital · Panel activo</div>
  </div>
  <div class="main-tabs">
    <button class="mt-tab active" onclick="switchMainTab('chat',this)">💬 Chats</button>
    <button class="mt-tab" onclick="switchMainTab('ranking',this)">🏆 Rankings</button>
  </div>
  <div class="sb-search"><input placeholder="🔍 Buscar vendedor..." oninput="searchList(this.value)" id="sbSearch"></div>
  <div class="contact-list" id="contactList"></div>
</div>

<!-- ── MAIN AREA ── -->
<div class="main-area">

  <!-- CHAT VIEW -->
  <div class="chat-view" id="chatView">
    <div class="chat-empty" id="chatEmpty">
      <div class="chat-empty-icon">🤖</div>
      <div class="chat-empty-lbl">Seleccioná un vendedor para ver su chat</div>
    </div>
    <div id="chatMain" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="chat-hdr" id="chatHdr"></div>
      <div class="quick-chips" id="quickChips"></div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="typing-wrap" id="typingWrap"><div class="typing-b"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>
      <div class="chat-input-area">
        <input class="chat-inp" id="chatInp" placeholder="Respondé al Supervisor..." onkeydown="if(event.key==='Enter')sendReply()">
        <button class="send-btn" onclick="sendReply()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>
    </div>
  </div>

  <!-- RANKING VIEW -->
  <div class="rank-view" id="rankView">
    <div class="rv-top">
      <div class="rv-title">📊 Rankings del Equipo</div>
      <div class="period-tabs" id="periodTabs">
        <button class="pt active" onclick="setPeriod('mes',this)">Mes</button>
        <button class="pt" onclick="setPeriod('q1',this)">Q1</button>
        <button class="pt" onclick="setPeriod('q2',this)">Q2</button>
        <button class="pt" onclick="setPeriod('q3',this)">Q3</button>
        <button class="pt" onclick="setPeriod('q4',this)">Q4</button>
      </div>
      <button class="rv-export" onclick="showToast('📊 Exportando reporte PDF...')">Exportar PDF</button>
    </div>
    <div id="rankContent"></div>
  </div>

</div><!-- /main-area -->
</div><!-- /app -->
<div class="toast" id="toast"></div>

const medals=['🥇','🥈','🥉'];
const conn=['on','on','on','away','on','on','away','on','off','on','away','off','off'];
let currentPeriod='mes';
let activeId=null;
let currentMainTab='chat';

// ─── SIDEBAR BUILD ────────────────────────────────────────────────────────────
function getRankPos(id, period){
  const data=rankPeriods[period]||rankPeriods.mes;
  const idx=data.findIndex(r=>r.id===id);
  return idx>=0?idx+1:null;
}
function getScore(id,period){
  const data=rankPeriods[period]||rankPeriods.mes;
  const r=data.find(x=>x.id===id);
  return r?r.score:50;
}
function rankColor(pos){
  if(pos===1)return'#F59E0B';
  if(pos===2)return'#94A3B8';
  if(pos===3)return'#B45309';
  if(pos<=5)return'#1a6fba';
  if(pos<=9)return'#6B7280';
  return'#EF4444';
}

function buildSidebar(search=''){
  const list=document.getElementById('contactList');
  list.innerHTML='';
  const managers=staff.filter(s=>s.isManager);
  const execs=staff.filter(s=>!s.isManager);

  function renderGroup(label,group){
    const filtered=group.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.role.toLowerCase().includes(search.toLowerCase()));
    if(!filtered.length)return;
    const sec=document.createElement('div');sec.className='list-section';sec.textContent=label;list.appendChild(sec);
    filtered.forEach((s,gi)=>{
      const pos=s.isManager?null:getRankPos(s.id,currentPeriod);
      const score=getScore(s.id,currentPeriod);
      const pct=score;
      const barClass=score>=80?'mf-h':score>=65?'mf-m':score>=50?'mf-l':'mf-x';
      const rc=rankColor(pos);
      const lastMsg=s.messages[s.messages.length-1];
      const preview=lastMsg?lastMsg.text.replace(/<[^>]+>/g,'').substring(0,38)+'…':'';
      const el=document.createElement('div');
      el.className='contact-item'+(activeId===s.id?' active':'');
      el.id='ci-'+s.id;
      el.onclick=()=>currentMainTab==='chat'?openChat(s.id):openChat(s.id);
      el.innerHTML=`
        <div class="ci-av" style="background:${s.color}">${s.ini}<div class="ci-online"></div></div>
        <div class="ci-body">
          <div class="ci-row1">
            <div class="ci-name">${s.name}</div>
            ${pos?`<div class="rank-pill">
              <div class="rp-pos" style="background:${rc};font-size:8px">${pos<=3?medals[pos-1]:'#'+pos}</div>
              <div class="rp-bar-wrap"><div class="rp-bar ${barClass}" style="width:${pct}%"></div></div>
            </div>`:''}
            ${s.pendingCount>0?`<div class="ci-badge">${s.pendingCount}</div>`:''}
          </div>
          <div class="ci-preview">${pos?`Puesto ${pos} · `:''}${preview}</div>
        </div>`;
      list.appendChild(el);
    });
  }
  renderGroup('Gerencia',managers);
  renderGroup('Equipo de Ventas',execs);
}

function searchList(v){buildSidebar(v);}

// ─── MAIN TAB SWITCH ─────────────────────────────────────────────────────────
function switchMainTab(tab,btn){
  currentMainTab=tab;
  document.querySelectorAll('.mt-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='chat'){
    document.getElementById('chatView').style.display='flex';
    document.getElementById('rankView').style.display='none';
  } else {
    document.getElementById('chatView').style.display='none';
    document.getElementById('rankView').style.display='block';
    renderRanking(currentPeriod);
  }
}

  buildSidebar(document.getElementById('sbSearch').value);
}

function renderRanking(period){
  const data=[...(rankPeriods[period]||rankPeriods.mes)];
  const content=document.getElementById('rankContent');
  content.innerHTML='';

  kpiSections.forEach(sec=>{
    // Sort by this KPI
    const sorted=[...data].sort((a,b)=>sec.higher?(b[sec.key]-a[sec.key]):(a[sec.key]-b[sec.key]));

    const wrap=document.createElement('div');
    wrap.className='kpi-section';
    const isOpen=sectionOpen[sec.key]!==false;

    wrap.innerHTML=`
      <div class="ks-head" onclick="toggleSection('${sec.key}',this)">
        <span class="ks-icon">${sec.icon}</span>
        <span class="ks-title">${sec.title}</span>
        <span class="ks-desc">— ${sec.desc}</span>
        <span class="ks-toggle">${isOpen?'▲ Cerrar':'▼ Ver'}</span>
      </div>
      <div class="ks-body" id="ksb-${sec.key}" style="max-height:${isOpen?'800px':'0'};overflow:hidden">
        <table class="rk-table">
          <thead><tr>
            <th style="width:20px">#</th>
            <th style="text-align:left;min-width:130px">Vendedor</th>
            <th>${sec.title}</th>
            <th>Estado</th>
            <th>Barra</th>
          </tr></thead>
          <tbody>
            ${sorted.map((r,i)=>{
              const s=staff.find(x=>x.id===r.id);
              if(!s)return'';
              const val=r[sec.key];
              const maxVal=sorted[0][sec.key];
              const minVal=sorted[sorted.length-1][sec.key];
              const range=maxVal-minVal||1;
              const pct=sec.higher?Math.round(((val-minVal)/range)*100):Math.round(((maxVal-val)/range)*100);
              const barClass=pct>=75?'mf-h':pct>=50?'mf-m':pct>=25?'mf-l':'mf-x';
              const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
              return`<tr>
                <td style="text-align:center">${medal||`<span style="color:var(--muted);font-size:10px">${i+1}</span>`}</td>
                <td><div class="vend-cell">
                  <div class="vav" style="background:${s.color}">${s.ini}</div>
                  <div><div class="vname">${s.short}</div><div class="vsub">${s.role.replace('Ejecutiv','Ejec.').replace(' de Cuentas','').replace(' Interior',' Int.')}</div></div>
                </div></td>
                <td><span class="${sec.badge(val)}">${sec.fmt(val)}${sec.unit?' '+sec.unit:''}</span></td>
                <td><span style="font-size:9px;font-weight:700;color:${pct>=75?'var(--teal)':pct>=50?'var(--blue)':pct>=25?'var(--gold)':'var(--red)'}">${pct>=75?'✓ Top':pct>=50?'~ Bien':pct>=25?'↓ Bajo':'✗ Crítico'}</span></td>
                <td><div class="mini-bar-wrap"><div class="mini-track"><div class="mini-fill ${barClass}" style="width:${pct}%"></div></div><span style="font-size:9px;color:var(--muted)">${pct}%</span></div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    content.appendChild(wrap);
  });
}

function toggleSection(key,headEl){
  sectionOpen[key]=!sectionOpen[key];
  const body=document.getElementById('ksb-'+key);
  body.style.maxHeight=sectionOpen[key]?'800px':'0';
  headEl.querySelector('.ks-toggle').textContent=sectionOpen[key]?'▲ Cerrar':'▼ Ver';
}

// ─── CHAT ─────────────────────────────────────────────────────────────────────
function hora(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function showToast(msg){const t=document.getElementById('toast');t.innerHTML=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}

function openChat(id){
  // Switch to chat view if on ranking tab
  if(currentMainTab==='ranking'){
    document.querySelector('.mt-tab').click();
  }
  activeId=id;
  const p=staff.find(s=>s.id===id);if(!p)return;
  document.getElementById('chatEmpty').style.display='none';
  const cm=document.getElementById('chatMain');cm.style.display='flex';

  const pos=getRankPos(id,currentPeriod);
  const score=getScore(id,currentPeriod);

  document.getElementById('chatHdr').innerHTML=`
    <div class="ch-av" style="background:${p.color}">${p.ini}</div>
    <div><div class="ch-name">${p.name}</div><div class="ch-status">${p.role} · ${p.email}</div></div>
    <div class="ch-right">
      ${pos?`<div class="ch-rank-badge">${pos<=3?medals[pos-1]:'#'+pos} Puesto ${pos} · ${score}pts</div>`:''}
      ${p.pendingCount>0?`<div class="ch-tag">⚠ ${p.pendingCount} pendientes</div>`:'<div class="ch-tag">✓ Al día</div>'}
    </div>`;

  const chips=p.isManager?['Resumen equipo','Ver pendientes','Pipeline hoy','Rankings']:['¿Qué más tengo hoy?','Ver mi puesto','¿Qué puedo ofrecer?','Mis pendientes'];
  document.getElementById('quickChips').innerHTML=chips.map(c=>`<button class="qc" onclick="sendReplyText('${c}')">${c}</button>`).join('');

  const msgArea=document.getElementById('chatMsgs');
  msgArea.innerHTML='';
  const ds=document.createElement('div');ds.className='date-sep';ds.innerHTML='<span>Hoy</span>';msgArea.appendChild(ds);
  p.messages.forEach(m=>renderMsg(m,msgArea,p));
  msgArea.scrollTop=msgArea.scrollHeight;
  buildSidebar(document.getElementById('sbSearch').value);
}

function renderMsg(m,container,person){
  const wrap=document.createElement('div');wrap.className='msg-wrap in';
  const bc=m.type==='proactive'?'proactive':m.type==='alert'?'alert-msg':'in';
  const acts=m.actions&&m.actions.length?`<div class="msg-actions">${m.actions.map(a=>`<button class="m-btn" onclick="handleAction(this,'${a}','${person.id}')">${a}</button>`).join('')}</div>`:'';
  wrap.innerHTML=`<div class="msg-b ${bc}"><div class="msg-sender">🤖 Supervisor Digital</div><div>${m.text.replace(/\n/g,'<br>')}</div>${acts}<div class="msg-tr"><span class="msg-time">${m.time}</span></div></div>`;
  container.appendChild(wrap);
}

const actionReplies={
  'Sí, preparame el mensaje':'Mensaje listo para DataCenter BA:\n\n<em>"Hola Marcelo, te escribe Martín desde Microglobal. Te enviamos la propuesta HPE ProLiant DL380 Gen11 hace unos días. ¿Pudiste revisarla? Tenemos stock confirmado y podemos ajustar tiempos de entrega. ¿Hablamos hoy?"</em>\n\n¿Lo enviamos así?',
  'Sí, enviala ya':'✅ Propuesta enviada a TechAndina Rosario. Registrada en CRM. Seguimiento activo en 48 hs.',
  'Resolver los dos':'✅ Respuestas preparadas. Nexcom: stock Cisco confirmado, cotización adjunta. TechSur: precio HPE MR408i-o enviado. ¿Las revisás antes de mandar?',
  'Activar recordatorio':'✅ Recordatorio masivo enviado al equipo. Martín, Mauricio, Esteban, Valeria y Leandro recibieron notificación con sus pendientes.',
  'Ver detalle equipo':'Resumen:\n• Martín: 3 pendientes (2 cotiz. vencidas, 1 correo)\n• Mauricio: propuesta sin enviar 3 días\n• Esteban: 3 correos sin contestar\n• Valeria: propuesta vencida 4 días\n• Leandro: 2 seguimientos sin actividad\nResto al día.',
  'Sí, generá los mensajes':'✅ Mensajes para Tecno Mendoza, DataSur Tucumán, InfoCba y Net Neuquén listos. Cada uno personalizado con historial de compra + HP ProBook 460 G11. ¿Los reviso con vos o los envío directo?',
  'Sí, arrancá por DataCore':'✅ Respuesta técnica para DataCore BA:\n<em>"Hola equipo, confirmamos disponibilidad Cisco Nexus 9000. Tenemos C9300-48P en stock CABA. Adjunto datasheet y cotización."</em>\n¿Enviamos?',
  'Ver mi puesto':`Tu posición actual en el ranking del equipo es puesto ${()=>activeId?getRankPos(activeId,currentPeriod):'?'}. Seguí así — cada cotización rápida suma. ¿Querés ver en qué KPI podés mejorar más?`,
  'default':'Entendido. Registrado. Avisame si necesitás que avance con algo específico.',
};

function handleAction(btn,action,pid){
  btn.closest('.msg-actions').querySelectorAll('.m-btn').forEach(b=>{b.disabled=true;b.style.opacity='.5'});
  btn.classList.add('done');
  const p=staff.find(s=>s.id===pid);
  const ma=document.getElementById('chatMsgs');
  const uw=document.createElement('div');uw.className='msg-wrap out';
  uw.innerHTML=`<div class="msg-b out">${action}<div class="msg-tr"><span class="msg-time">${hora()}</span><span class="msg-ticks">✓✓</span></div></div>`;
  ma.appendChild(uw);ma.scrollTop=ma.scrollHeight;
  const tw=document.getElementById('typingWrap');tw.style.display='block';
  setTimeout(()=>{
    tw.style.display='none';
    const resp=actionReplies[action]||actionReplies['default'];
    const sw=document.createElement('div');sw.className='msg-wrap in';
    sw.innerHTML=`<div class="msg-b in"><div class="msg-sender">🤖 Supervisor Digital</div>${resp.replace(/\n/g,'<br>')}<div class="msg-tr"><span class="msg-time">${hora()}</span></div></div>`;
    ma.appendChild(sw);ma.scrollTop=ma.scrollHeight;
    if(p&&p.pendingCount>0)p.pendingCount=Math.max(0,p.pendingCount-1);
    buildSidebar();showToast('✅ Acción ejecutada');
  },1100+Math.random()*600);
}

function sendReply(){const i=document.getElementById('chatInp');const t=i.value.trim();if(!t||!activeId)return;i.value='';sendReplyText(t);}

function sendReplyText(txt){
  if(!activeId)return;
  const ma=document.getElementById('chatMsgs');
  const uw=document.createElement('div');uw.className='msg-wrap out';
  uw.innerHTML=`<div class="msg-b out">${txt}<div class="msg-tr"><span class="msg-time">${hora()}</span><span class="msg-ticks">✓✓</span></div></div>`;
  ma.appendChild(uw);ma.scrollTop=ma.scrollHeight;
  const tw=document.getElementById('typingWrap');tw.style.display='block';
  const pos=activeId?getRankPos(activeId,currentPeriod):'?';
  const replies={
    '¿Qué más tengo hoy?':'Además de lo que te mandé, hay una oportunidad de cross-sell esta semana. ¿Querés que arme la lista de clientes candidatos?',
    'Ver mi puesto':`Estás en el puesto <strong>${pos}</strong> del equipo este período. Tu mejor categoría es correos contestados. Donde más podés mejorar: tiempo de respuesta. ¿Querés el detalle?`,
    '¿Qué puedo ofrecer?':'Según tu cartera: ① Kingston NV3 2TB para clientes con servers (3 candidatos), ② APC Smart-UPS sin UPS activo (2 candidatos), ③ HP ProBook renovación (1 candidato). ¿Arrancamos?',
    'Mis pendientes':'Tus pendientes activos están en los mensajes de arriba. ¿Querés que los gestione yo directamente?',
    'Resumen equipo':'12 tareas pendientes en el equipo. Críticos: Esteban (DataCore BA), Valeria (propuesta vencida 4 días), Martín (cotización 6 días). ¿Activo recordatorio masivo?',
    'Ver pendientes':'Pendientes críticos: ① Esteban — DataCore BA 19 hs. ② Valeria — propuesta vencida 4 días. ③ Martín — USD 28K sin seguimiento 6 días.',
    'Pipeline hoy':'Pipeline activo urgente: USD 68.400. Top 3: DataCenter BA USD 28K (Martín), Grupo DataNet USD 21K (Valeria), TechAndina USD 19K (Mauricio).',
    'Rankings':'Para ver los rankings completos, tocá la pestaña <strong>🏆 Rankings</strong> arriba en el menú izquierdo. Podés filtrar por mes, Q1, Q2, Q3 y Q4.',
  };
  const r=replies[txt]||'Entendido. Procesando. Avisame si necesitás algo específico del pipeline o un cliente.';
